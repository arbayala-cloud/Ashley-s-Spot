<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fdfdfc; color: #161616; font-family: Georgia, 'Times New Roman', serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 20px 22px 48px; }
  header { text-align: center; }
  h1.masthead { margin: 18px 0 0; font-family: 'Indie Flower', cursive; font-weight: 400; font-size: 84px; line-height: 1.05; color: #111; }
  h1.masthead a { color: #111; text-decoration: none; }
  .rule-top { border-top: 3px solid #111; border-bottom: 1px solid #111; height: 4px; margin-top: 10px; }
  .tagline { margin-top: 14px; font-family: Arial, Helvetica, sans-serif; font-size: 11px; letter-spacing: 2.2px; text-transform: uppercase; color: #444; text-align: center; }
  section { margin-top: 38px; }
  section h2 { margin: 0 0 14px; font-family: 'Bitter', Georgia, serif; font-weight: 900; font-size: 27px; letter-spacing: .2px; color: #111; border-bottom: 2px solid #111; padding-bottom: 10px; }
  .story-note { margin: 0; font-size: 16px; line-height: 1.6; color: #2b2b2b; }
  footer { border-top: 3px double #111; margin-top: 46px; padding-top: 16px; font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; text-align: center; color: #999; }
  .menu-row { text-align: center; margin: 14px 0 0; }
  .menu-row button { font-family: Arial, Helvetica, sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; background: none; color: #111; border: 1.5px solid #111; border-radius: 999px; padding: 7px 18px; cursor: pointer; }
  .menu-panel { display: none; text-align: center; margin-top: 6px; }
  .menu-panel.open { display: block; }

  .menu-panel button.install-btn { display: block; width: 100%; font-family: 'Bitter', Georgia, serif; font-weight: 700; font-size: 20px; line-height: 1.3; color: #111; background: none; border: none; padding: 8px 0; cursor: pointer; }
  body.dark .menu-panel button.install-btn { color: #f4f1ea; }
  @media (hover: hover) { .menu-panel a:hover { text-decoration: underline; text-underline-offset: 3px; } }
  .mila-photo { width: 100%; height: auto; display: block; border-radius: 16px; border: 3px double #e07b39; }
  .halloween-banner { width: 100%; height: auto; display: block; border-radius: 16px; margin-top: 24px; }
  .dancing-pair { display: block; width: 200px; height: auto; margin: 28px auto 0; }

  .home-link { text-align: center; margin-top: 30px; }
  .home-link a { font-family: Arial, Helvetica, sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #111; text-decoration: none; border: 1.5px solid #111; border-radius: 999px; padding: 9px 22px; display: inline-block; }
  .foot-name { font-size: 12px; letter-spacing: 3px; color: #555; margin-bottom: 8px; }
  .theme-toggle { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 0 10px; border-top: 1px solid #eee9df; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; color: #6f6a62; }
  .theme-switch { position: relative; width: 50px; height: 28px; flex: 0 0 auto; }
  .theme-switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .theme-switch .slider { position: absolute; inset: 0; background: #c9c2b6; border-radius: 999px; transition: .25s; }
  .theme-switch .slider::before { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; background: #fff; border-radius: 50%; transition: .25s; }
  .theme-switch input:checked + .slider { background: #b9975b; }
  .theme-switch input:checked + .slider::before { transform: translateX(22px); }
  .theme-switch input:focus-visible + .slider { outline: 2px solid #b9975b; outline-offset: 2px; }

  body.dark { background: #1c1a17; color: #f4f1ea; }

  body.dark .menu-row button { color: #f4f1ea; border-color: #f4f1ea; }
  body.dark .menu-panel a { color: #f4f1ea; }
  body.dark .home-link a { color: #f4f1ea; border-color: #f4f1ea; }
  body.dark .theme-toggle { color: #b8b0a3; border-top-color: #3a3631; }

  @media (max-width: 640px) { h1.masthead { font-size: 42px; } .wrap { padding: 26px 16px 40px; } section h2 { font-size: 23px; } .dancing-pair { width: 160px; } }

<script>
  document.getElementById('menuBtn').addEventListener('click', function () {
    var panel = document.getElementById('menuPanel');
    var open = panel.classList.toggle('open');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // Site-wide dark / light choice, saved so every page opens the same way.
  (function () {
    var toggle = document.getElementById('themeToggle');
    function applyTheme(dark) {
      document.body.classList.toggle('dark', dark);
      if (toggle) toggle.checked = dark;
      try { localStorage.setItem('ashleys-theme', dark ? 'dark' : 'light'); } catch (e) {}
    }
    try { if (localStorage.getItem('ashleys-theme') === 'dark') applyTheme(true); } catch (e) {}
    if (toggle) toggle.addEventListener('change', function () { applyTheme(this.checked); });
  })();

</script>

<script>
  (function() {
    var installBtn = document.getElementById('installBtn');
    var deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
    if (installBtn) {
      installBtn.addEventListener('click', function() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function() { deferredPrompt = null; });
        } else {
          alert("To install Ashley's Spot on your phone: open this page in Chrome, tap the three dots menu, then tap Add to Home Screen.");
        }
      });
    }
  })();
</script>
