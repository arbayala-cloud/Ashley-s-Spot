<style>

  .theme-switch .slider::before { content: ""; position: absolute; left: 3px; top: 3px; width: 21px; height: 21px; background: #fffdf8; border-radius: 50%; transition: .25s; box-shadow: 0 1px 3px rgba(43,35,32,.25); }

  .menu-panel { display: none; background: #fffdf8; border: 1px solid #e3d5b8; border-radius: 10px; padding: 8px 0; margin: 16px auto 4px; max-width: 420px; text-align: center; box-shadow: 0 14px 30px rgba(43,35,32,.10); position: relative; z-index: 5; }

<style id="housecat-style">
/* The House Cat: a tabby companion who lives on the homepage and always has something to say.
   Hand-coded SVG in the Sammie tradition, re-skinned as a tabby with a bigger vocabulary. */
#catPal { position: fixed; left: -200px; top: 110vh; width: 104px; z-index: 99990; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: left 4.4s ease-in-out, top 4.4s ease-in-out; touch-action: manipulation; user-select: none; -webkit-user-select: none; --fur: #9a7b58; --furd: #6e5638; --bib: #ece1cb; --eye: #5f7d3a; --ear: #c98a7d; }
#catPal .cat-bob { animation: hcatBob 3.6s ease-in-out infinite; }
#catPal svg { display: block; width: 100%; height: auto; overflow: visible; }
#catPal .cat-flip { transition: transform .45s ease; }
#catPal .cat-flip.flip { transform: scaleX(-1); }
#catPal .cf { fill: var(--fur); } #catPal .cfd { fill: var(--furd); } #catPal .cb { fill: var(--bib); }
#catPal .ce { fill: var(--eye); } #catPal .cer { fill: var(--ear); } #catPal .sf { stroke: var(--furd); }
#catPal .cat-tail { transform-box: fill-box; transform-origin: 15% 85%; animation: hcatTail 2.9s ease-in-out infinite alternate; }
#catPal .cat-eyes { transform-box: fill-box; transform-origin: center; animation: hcatBlink 5.4s infinite; }
#catPal .cat-shadow { transform-box: fill-box; transform-origin: center; animation: hcatShadow 3.6s ease-in-out infinite; }
#catPal.petted svg { animation: hcatSquish .38s ease; }
#catPal .cat-bubble { position: absolute; left: 50%; bottom: 97%; transform: translate(-50%, 6px) scale(.94); width: 232px; max-width: 72vw; background: #fffdf8; color: #2b2320; border: 1px solid #d9c9a8; border-radius: 14px; padding: 10px 12px 9px; text-align: left; opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; box-shadow: 0 10px 26px rgba(43,35,32,.18); }
#catPal .cat-bubble:after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px; transform: translateX(-50%) rotate(45deg); background: #fffdf8; border-right: 1px solid #d9c9a8; border-bottom: 1px solid #d9c9a8; }
#catPal .cat-bubble.show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
#catPal .cat-chiprow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
#catPal .cat-chip { font: 600 9px Oswald, Inter, sans-serif; letter-spacing: 2px; text-transform: uppercase; background: #a15c68; color: #fff; border-radius: 999px; padding: 2.5px 9px; }
#catPal .cat-x { background: none; border: none; color: #8a7a68; font-size: 16px; line-height: 1; cursor: pointer; padding: 8px 9px; margin: -6px -5px -6px 0; min-width: 32px; min-height: 32px; }
#catPal .cat-say { font: 500 13.5px/1.5 Fraunces, Georgia, serif; display: block; }
#catPal .cat-by { font: 600 9.5px Oswald, Inter, sans-serif; letter-spacing: 1.6px; text-transform: uppercase; color: #8a7a68; margin-top: 6px; }
#catPal .cat-by:empty { display: none; }
body.dark #catPal .cat-bubble { background: #2a231c; color: #f4ead9; border-color: #55462f; box-shadow: 0 10px 26px rgba(0,0,0,.5); }
body.dark #catPal .cat-bubble:after { background: #2a231c; border-right-color: #55462f; border-bottom-color: #55462f; }
body.dark #catPal .cat-by, body.dark #catPal .cat-x { color: #cbb9a6; }
#catPal .cat-heart { position: absolute; left: 50%; top: 6px; font-size: 15px; pointer-events: none; animation: hcatRise 1.15s ease-out forwards; }
@keyframes hcatBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes hcatShadow { 0%, 100% { transform: scaleX(1); opacity: .16; } 50% { transform: scaleX(.88); opacity: .11; } }
@keyframes hcatTail { from { transform: rotate(-3.5deg); } to { transform: rotate(5deg); } }
@keyframes hcatBlink { 0%, 91%, 100% { transform: scaleY(1); } 94.5% { transform: scaleY(.08); } 97.5% { transform: scaleY(1); } }
@keyframes hcatSquish { 0% { transform: scale(1, 1); } 35% { transform: scale(1.07, .93); } 70% { transform: scale(.97, 1.04); } 100% { transform: scale(1, 1); } }
@keyframes hcatRise { 0% { transform: translate(-50%, 0) scale(.7); opacity: 0; } 18% { opacity: 1; } 100% { transform: translate(calc(-50% + var(--drift, 0px)), -52px) scale(1.15); opacity: 0; } }
@media (max-width: 560px) { #catPal { width: 88px; } #catPal .cat-bubble { width: 208px; } }
@media (prefers-reduced-motion: reduce) { #catPal { transition: none; } #catPal .cat-bob, #catPal .cat-tail, #catPal .cat-shadow { animation: none; } #catPal .cat-eyes { animation-duration: 9s; } }
</style>

<script>
  document.getElementById('menuBtn').addEventListener('click', function () {
    var panel = document.getElementById('menuPanel');
    var open = panel.classList.toggle('open');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // Site-wide dark / light choice, saved so every page opens the same way.
  (function () {
    var toggle = document.getElementById('themeToggle');
    function applyTheme(dark) {
      document.body.classList.toggle('dark', dark);
      if (toggle) toggle.checked = dark;
      try { localStorage.setItem('ashleys-theme', dark ? 'dark' : 'light'); } catch (e) {}
    }
    try { if (localStorage.getItem('ashleys-theme') === 'dark') applyTheme(true); } catch (e) {}
    if (toggle) toggle.addEventListener('change', function () { applyTheme(this.checked); });
  })();

</script>

  function setBtn() { playBtn.textContent = playing ? '\u23f8' : '\u25b6'; }
  window.onSotdYouTubeReady = function () {
    player = new YT.Player('sotdPlayer', {
      height: '1', width: '1',
      playerVars: { rel: 0, modestbranding: 1 },
      events: {
        onReady: function () {
          playerReady = true;
          if (wantPlay) { player.loadVideoById(song[2]); started = true; }
        },
        onStateChange: function (e) {
          if (e.data === 1) { playing = true; }
          else if (e.data === 2 || e.data === 0) { playing = false; }
          setBtn();
        }
      }
    });
  };
  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
  // The YouTube API looks for a global onYouTubeIframeAPIReady; chain it to ours.
  var prevReady = window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady = function () {
    if (prevReady) prevReady();
    window.onSotdYouTubeReady();
  };
  playBtn.addEventListener('click', function () {
    if (playing) { player.pauseVideo(); return; }
    wantPlay = true;
    if (playerReady) {
      if (started) { player.playVideo(); } else { player.loadVideoById(song[2]); started = true; }
    }
  });
  rewBtn.addEventListener('click', function () {
    wantPlay = true;
    if (playerReady) {
      if (started) { player.seekTo(0); player.playVideo(); } else { player.loadVideoById(song[2]); started = true; }
    }
  });
  ffBtn.addEventListener('click', function () {
    songIndex = (songIndex + 1) % SOTD.length;
    song = SOTD[songIndex];
    showSong();
    started = false;
    wantPlay = true;
    if (playerReady) { player.loadVideoById(song[2]); started = true; }
  });
})();
</script>

(function () {
  var now = new Date();
  var start = new Date(now.getFullYear(), 0, 0);
  var day = Math.floor((now - start) / 86400000);
  var cur = day % CARTOONS.length;
  var tries = 0;
  var img = document.getElementById('dailyCartoon');
  var cred = document.getElementById('cartoonCredit');
  var cap = document.getElementById('polaroidCaption');
  var backName = document.getElementById('polaroidBackName');
  var backYear = document.getElementById('polaroidBackYear');
  var backFact = document.getElementById('polaroidBackFact');
  function show(i) {
    var n = ((i % CARTOONS.length) + CARTOONS.length) % CARTOONS.length;
    cur = n;
    var c = CARTOONS[n];
    img.alt = c.name + ' - 90s cartoon of the day';
    cred.textContent = c.name + ' \u2014 Photo: ' + c.credit;
    img.src = c.img;
    cap.textContent = c.name + ' - ' + c.year;
    backName.textContent = c.name;
    backYear.textContent = c.year;
    backFact.textContent = c.fact;
  }
  img.onerror = function () {
    tries++;
    if (tries < CARTOONS.length) { show(cur + 1); }
  };
  show(cur);
  var card = document.getElementById('polaroidCard');
  function flipCard() { card.classList.toggle('flipped'); }
  card.addEventListener('click', flipCard);
  card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flipCard(); } });
  document.getElementById('cartoonPrev').addEventListener('click', function () { card.classList.remove('flipped'); tries = 0; show(cur - 1); });
  document.getElementById('cartoonNext').addEventListener('click', function () { card.classList.remove('flipped'); tries = 0; show(cur + 1); });
})();
</script>

<script>
  (function () {
    // Back up everything this site has saved on this device (blog posts,
    // keepsakes, settings) into one JSON file she keeps.
    var backupBtn = document.getElementById('backupBtn');
    if (backupBtn) backupBtn.addEventListener('click', function () {
      var data = {};
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          data[k] = localStorage.getItem(k);
        }
      } catch (e) {}
      var payload = { app: "Ashley's Spot", backedUp: new Date().toISOString(), data: data };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'ashleys-spot-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    });

    // Restore a backup file made by the button above.
    var restoreBtn = document.getElementById('restoreBtn');
    var restoreFile = document.getElementById('restoreFile');
    if (restoreBtn && restoreFile) {
      restoreBtn.addEventListener('click', function () { restoreFile.click(); });
      restoreFile.addEventListener('change', function () {
        var f = restoreFile.files && restoreFile.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var parsed = JSON.parse(String(reader.result));
            var data = parsed && parsed.data ? parsed.data : parsed;
            if (!data || typeof data !== 'object') throw new Error('bad file');
            if (!window.confirm('Restore this backup? It replaces the data saved on this device.')) return;
            Object.keys(data).forEach(function (k) {
              try { localStorage.setItem(k, data[k]); } catch (e) {}
            });
            window.alert('Backup restored. The page will reload.');
            location.reload();
          } catch (e) {
            window.alert('That file does not look like an Ashley\'s Spot backup.');
          }
        };
        reader.readAsText(f);
      });
    }

    // Update App: check for the newest service worker, clear stored caches,
    // then reload from the server so she is always on the latest version.
    var updateBtn = document.getElementById('updateBtn');
    if (updateBtn) updateBtn.addEventListener('click', function () {
      updateBtn.textContent = 'Updating\u2026';
      var done = function () {
        location.replace(location.pathname + '?updated=' + Date.now());
      };
      var jobs = [];
      try {
        if ('serviceWorker' in navigator) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.update(); }));
          }));
        }
        if (window.caches && caches.keys) {
          jobs.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }));
        }
      } catch (e) {}
      Promise.all(jobs).then(done, done);
      setTimeout(done, 3500); // never leave her hanging
    });
  })();
</script>

<script>
  (function () {
    var KEY = 'ashleys-view';
    var btns = Array.prototype.slice.call(document.querySelectorAll('.view-btn'));
    function apply(mode) {
      document.body.classList.toggle('view-mobile', mode === 'mobile');
      document.body.classList.toggle('view-desktop', mode === 'desktop');
      btns.forEach(function (b) {
        var on = b.getAttribute('data-view') === mode;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved === 'mobile' || saved === 'desktop') apply(saved);
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        var mode = b.getAttribute('data-view');
        var cur = null;
        try { cur = localStorage.getItem(KEY); } catch (e) {}
        if (cur === mode) { try { localStorage.removeItem(KEY); } catch ( e) {} apply(null); }
        else { try { localStorage.setItem(KEY, mode); } catch (e) {} apply(mode); }
      });
    });
  })();
</script>
