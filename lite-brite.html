<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lite-Brite — Ashley Ayala</title>
<meta name="theme-color" content="#141210">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #141210; color: #ece5d3; font-family: Inter, Arial, sans-serif; min-height: 100vh; padding: 26px 14px 60px; background-image: radial-gradient(ellipse at 50% -10%, #2b251d 0%, #141210 55%); }
  .wrap { max-width: 720px; margin: 0 auto; text-align: center; }
  .back { display: inline-block; color: #c8a165; text-decoration: none; font-family: Oswald, Inter, sans-serif; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px; }
  .back:hover { color: #e8ddcb; }
  .eyebrow { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: #c8a165; font-weight: 600; }
  h1 { font-family: Oswald, Inter, sans-serif; font-size: 42px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin: 8px 0 4px; color: #f2ead6; text-shadow: 0 0 24px rgba(255, 190, 90, .25); }
  .sub { color: #a89e88; font-size: 14px; margin-bottom: 22px; }
  .unit { background: linear-gradient(180deg, #2e2a24, #211d17); border: 2px solid #4a4238; border-radius: 22px; padding: 20px 16px 16px; box-shadow: 0 30px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(236,229,211,.12); }
  .unit.shake { animation: shake .45s ease; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px) rotate(-.4deg); } 40% { transform: translateX(6px) rotate(.4deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
  .screen { background: #0a0908; border-radius: 14px; padding: 12px; box-shadow: inset 0 0 40px rgba(0,0,0,.9), inset 0 0 6px rgba(0,0,0,.9); }
  #board { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .peg { aspect-ratio: 1; border-radius: 50%; border: none; padding: 0; cursor: pointer; background: radial-gradient(circle at 38% 35%, #2c2c2c, #171717 70%); box-shadow: inset 0 1px 2px rgba(255,255,255,.10), inset 0 -1px 2px rgba(0,0,0,.8); transition: background .08s, box-shadow .08s; }
  .peg.on { background: radial-gradient(circle at 38% 32%, rgba(255,255,255,.85), var(--peg) 42%, var(--peg) 100%); box-shadow: 0 0 10px 2px var(--peg), 0 0 22px 4px var(--peg-dim), inset 0 0 3px rgba(255,255,255,.55); }
  .tray { margin-top: 18px; }
  .tray-label { font-family: Oswald, Inter, sans-serif; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #a89e88; margin-bottom: 10px; }
  #palette { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .swatch { width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(236,229,211,.25); cursor: pointer; background: radial-gradient(circle at 38% 32%, rgba(255,255,255,.8), var(--peg) 45%, var(--peg)); box-shadow: 0 0 10px 1px var(--peg-dim); padding: 0; }
  .swatch.active { border-color: #fff; transform: scale(1.14); box-shadow: 0 0 14px 3px var(--peg-dim); }
  .swatch.eraser { background: #1b1b1b; box-shadow: none; color: #a89e88; font-size: 16px; line-height: 1; }
  .swatch.eraser.active { border-color: #c8a165; color: #e8ddcb; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
  .btn { font-family: Oswald, Inter, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; border-radius: 8px; padding: 11px 18px; cursor: pointer; border: 1.5px solid #57503f; background: #26221d; color: #ece5d3; }
  .btn:hover { border-color: #c8a165; color: #fff; }
  .btn.gold { background: #c8a165; border-color: #c8a165; color: #171410; }
  .btn.gold:hover { background: #d9b978; }
  .presets { margin-top: 14px; }
  .hint { margin-top: 18px; font-size: 12.5px; color: #79705c; }
  .brand { margin-top: 12px; font-family: Oswald, Inter, sans-serif; letter-spacing: 4px; font-size: 12px; color: #57503f; text-transform: uppercase; }
  @media (max-width: 480px) { h1 { font-size: 32px; } #board { gap: 2px; } .unit { padding: 14px 10px 12px; } }
</style>

<style id="cat-style">
/* The Cat: a fluffy little resident who floats around Ashley's Spot with her.
   Original hand-coded SVG art. Coat colors live in the data-coat rules below. */
#catPal { position: fixed; left: -200px; top: 110vh; width: 104px; z-index: 99990; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: left 4.4s ease-in-out, top 4.4s ease-in-out; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
#catPal .cat-bob { animation: catBob 3.6s ease-in-out infinite; }
#catPal svg { display: block; width: 100%; height: auto; overflow: visible; }
#catPal .cat-flip { transition: transform .45s ease; }
#catPal .cat-flip.flip { transform: scaleX(-1); }
#catPal .cf { fill: var(--fur); } #catPal .cfd { fill: var(--furd); } #catPal .cb { fill: var(--bib); }
#catPal .ce { fill: var(--eye); } #catPal .cer { fill: var(--ear); } #catPal .sf { stroke: var(--furd); }
#catPal[data-coat="midnight"] { --fur: #2e2a36; --furd: #1d1a24; --bib: #47405a; --eye: #ffb347; --ear: #c97b8a; }
#catPal[data-coat="pumpkin"] { --fur: #df8433; --furd: #b9661f; --bib: #f7c873; --eye: #4f9e57; --ear: #e59a8f; }
#catPal[data-coat="storm"] { --fur: #8d99ae; --furd: #68738a; --bib: #ccd6e4; --eye: #ffcf5c; --ear: #d99aa6; }
#catPal[data-coat="snowball"] { --fur: #f3ecdc; --furd: #d9cbae; --bib: #fffaf0; --eye: #5b9bd5; --ear: #e59aab; }
#catPal[data-coat="calico"] { --fur: #f3ecdc; --furd: #d9cbae; --bib: #fffaf0; --eye: #4f9e57; --ear: #e59aab; }
#catPal .cat-stripes, #catPal .cat-patches, #catPal .cat-hat { display: none; }
#catPal[data-coat="pumpkin"] .cat-stripes { display: block; }
#catPal[data-coat="calico"] .cat-patches { display: block; }
#catPal.hat-on .cat-hat { display: block; }
#catPal .cat-tail { transform-box: fill-box; transform-origin: 15% 85%; animation: catTail 2.9s ease-in-out infinite alternate; }
#catPal .cat-eyes { transform-box: fill-box; transform-origin: center; animation: catBlink 5.4s infinite; }
#catPal.sleeping .cat-eyes { animation: none; transform: scaleY(.12); }
#catPal .cat-shadow { transform-box: fill-box; transform-origin: center; animation: catShadow 3.6s ease-in-out infinite; }
#catPal.petted svg { animation: catSquish .38s ease; }
#catPal .cat-bubble { position: absolute; left: 50%; bottom: 96%; transform: translate(-50%, 6px) scale(.92); min-width: 128px; max-width: 190px; background: #fffdf6; color: #33302a; border: 2px solid #4a4238; border-radius: 12px; padding: 7px 9px 6px; font: 600 12px/1.35 Inter, system-ui, sans-serif; text-align: center; opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; box-shadow: 0 6px 18px rgba(20, 15, 5, .22); }
#catPal .cat-bubble:after { content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); border: 4px solid transparent; border-top: 6px solid #4a4238; }
#catPal .cat-bubble.show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
#catPal .cat-btns { display: flex; gap: 5px; justify-content: center; margin-top: 6px; }
#catPal .cat-btns button { font: 700 10.5px Inter, system-ui, sans-serif; letter-spacing: .02em; border: 1.5px solid #4a4238; background: #f4ead2; color: #4a3625; border-radius: 999px; padding: 3px 8px; cursor: pointer; }
#catPal .cat-btns button:active { transform: scale(.94); }
#catPal .cat-heart, #catPal .cat-zzz { position: absolute; left: 50%; top: 6px; font-size: 15px; pointer-events: none; animation: catRise 1.15s ease-out forwards; }
#catPal .cat-zzz { font: italic 700 13px Georgia, serif; color: #6b6390; }
@keyframes catBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes catShadow { 0%, 100% { transform: scaleX(1); opacity: .16; } 50% { transform: scaleX(.88); opacity: .11; } }
@keyframes catTail { from { transform: rotate(-3.5deg); } to { transform: rotate(5deg); } }
@keyframes catBlink { 0%, 91%, 100% { transform: scaleY(1); } 94.5% { transform: scaleY(.08); } 97.5% { transform: scaleY(1); } }
@keyframes catSquish { 0% { transform: scale(1, 1); } 35% { transform: scale(1.07, .93); } 70% { transform: scale(.97, 1.04); } 100% { transform: scale(1, 1); } }
@keyframes catRise { 0% { transform: translate(-50%, 0) scale(.7); opacity: 0; } 18% { opacity: 1; } 100% { transform: translate(calc(-50% + var(--drift, 0px)), -52px) scale(1.15); opacity: 0; } }
@media (max-width: 560px) { #catPal { width: 88px; } #catPal .cat-bubble { max-width: 168px; } }
@media (prefers-reduced-motion: reduce) { #catPal { transition: none; } #catPal .cat-bob, #catPal .cat-tail, #catPal .cat-shadow { animation: none; } #catPal .cat-eyes { animation-duration: 9s; } }
</style>

<body>
<div class="wrap">
  <a class="back" href="time-machine.html">&larr; Time Machine</a>
  <a class="back" href="aim.html" style="margin-left:16px;">AIM &rarr;</a>
  <p class="eyebrow">Ashley's Spot presents</p>
  <h1>Lite-Brite</h1>
  <p class="sub">Pick a color. Poke some pegs. Make it glow.</p>

  <div class="unit" id="unit">
    <div class="screen">
      <div id="board" aria-label="Lite-Brite peg board"></div>
    </div>
    <div class="tray">
      <p class="tray-label">Peg tray</p>
      <div id="palette"></div>
    </div>
    <div class="controls">
      <button class="btn" id="clearBtn" type="button">Shake &amp; Clear</button>
      <button class="btn gold" id="randomBtn" type="button">Surprise Me</button>
    </div>
    <div class="controls presets">
      <button class="btn" id="heartBtn" type="button">Heart</button>
      <button class="btn" id="starBtn" type="button">Star</button>
      <button class="btn" id="truckBtn" type="button">Truck</button>
    </div>
    <p class="brand">Lite-Brite &middot; Est. 1967 energy, coded 2026</p>
  </div>

  <p class="hint">Tip: hold and drag to paint a whole trail of pegs. Your picture saves itself on this device — it'll be right here when you come back.</p>
</div>

<script>
var COLS = 24, ROWS = 17, STORE_KEY = "ashleys-litebrite-v1";
var COLORS = [
  { name: "Red",    hex: "#ff3b30" },
  { name: "Orange", hex: "#ff9500" },
  { name: "Gold",   hex: "#ffd60a" },
  { name: "Green",  hex: "#34e07a" },
  { name: "Teal",   hex: "#40e0d0" },
  { name: "Blue",   hex: "#3b9dff" },
  { name: "Purple", hex: "#b26bff" },
  { name: "Pink",   hex: "#ff6fb5" },
  { name: "White",  hex: "#fff6e8" }
];
var boardEl = document.getElementById("board");
var paletteEl = document.getElementById("palette");
var pegs = [];
var current = COLORS[0].hex, erasing = false, painting = false;

function dim(hex) { return hex + "66"; }

function buildPalette() {
  COLORS.forEach(function (c) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "swatch" + (c.hex === current ? " active" : "");
    b.title = c.name; b.setAttribute("aria-label", c.name + " pegs");
    b.style.setProperty("--peg", c.hex); b.style.setProperty("--peg-dim", dim(c.hex));
    b.addEventListener("click", function () {
      current = c.hex; erasing = false;
      paletteEl.querySelectorAll(".swatch").forEach(function (s2) { s2.classList.remove("active"); });
      b.classList.add("active");
    });
    paletteEl.appendChild(b);
  });
  var e = document.createElement("button");
  e.type = "button"; e.className = "swatch eraser"; e.innerHTML = "&#10005;"; e.title = "Eraser";
  e.setAttribute("aria-label", "Eraser");
  e.addEventListener("click", function () {
    erasing = true;
    paletteEl.querySelectorAll(".swatch").forEach(function (s2) { s2.classList.remove("active"); });
    e.classList.add("active");
  });
  paletteEl.appendChild(e);
}

function paint(peg) {
  if (erasing) { peg.classList.remove("on"); peg.style.removeProperty("--peg"); peg.style.removeProperty("--peg-dim"); }
  else { peg.classList.add("on"); peg.style.setProperty("--peg", current); peg.style.setProperty("--peg-dim", dim(current)); }
  save();
}

function buildBoard() {
  for (var i = 0; i < COLS * ROWS; i++) {
    (function () {
      var peg = document.createElement("button");
      peg.type = "button"; peg.className = "peg"; peg.setAttribute("aria-label", "peg hole");
      peg.addEventListener("pointerdown", function (ev) { ev.preventDefault(); painting = true; paint(peg); });
      peg.addEventListener("pointerenter", function () { if (painting) paint(peg); });
      boardEl.appendChild(peg); pegs.push(peg);
    })();
  }
  window.addEventListener("pointerup", function () { painting = false; });
}

function save() {
  var lit = {};
  pegs.forEach(function (peg, i) { if (peg.classList.contains("on")) lit[i] = peg.style.getPropertyValue("--peg"); });
  try { localStorage.setItem(STORE_KEY, JSON.stringify(lit)); } catch (e) {}
}
function load() {
  var lit = {};
  try { lit = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) {}
  Object.keys(lit).forEach(function (i) {
    var peg = pegs[Number(i)]; if (!peg) return;
    peg.classList.add("on"); peg.style.setProperty("--peg", lit[i]); peg.style.setProperty("--peg-dim", dim(lit[i]));
  });
}
function clearBoard() {
  pegs.forEach(function (peg) { peg.classList.remove("on"); peg.style.removeProperty("--peg"); peg.style.removeProperty("--peg-dim"); });
  save();
}
function setPeg(r, c, hex) {
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
  var peg = pegs[r * COLS + c];
  peg.classList.add("on"); peg.style.setProperty("--peg", hex); peg.style.setProperty("--peg-dim", dim(hex));
}
function preset(fillFn) { clearBoard(); fillFn(); save(); }

function heartPreset() {
  for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
    var x = (c - (COLS - 1) / 2) / 7.6, y = ((ROWS - 1) / 2 - r) / 6.4;
    var v = Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y;
    if (v <= 0) setPeg(r, c, (r + c) % 5 === 0 ? "#ff6fb5" : "#ff3b30");
  }
}
function starPreset() {
  var cx = (COLS - 1) / 2, cy = (ROWS - 1) / 2, spikes = 5, outer = 7.6, inner = 3.1, pts = [];
  for (var i = 0; i < spikes * 2; i++) {
    var rad = i % 2 === 0 ? outer : inner, ang = (Math.PI / spikes) * i - Math.PI / 2;
    pts.push([cx + rad * Math.cos(ang) * 1.18, cy + rad * Math.sin(ang)]);
  }
  function inside(x, y) {
    var hit = false;
    for (var a = 0, b = pts.length - 1; a < pts.length; b = a++) {
      var xi = pts[a][0], yi = pts[a][1], xj = pts[b][0], yj = pts[b][1];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) hit = !hit;
    }
    return hit;
  }
  for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) if (inside(c, r)) setPeg(r, c, (r + c) % 4 === 0 ? "#ff9500" : "#ffd60a");
}
function truckPreset() {
  var body = "#c97b3f", bodyDark = "#a8642c", glass = "#9fd8e8", tire = "#232323", hub = "#e8ddcb", light = "#ffd60a";
  var r, c;
  for (c = 3; c <= 20; c++) { for (r = 10; r <= 13; r++) setPeg(r, c, body); }              // bed + body
  for (c = 13; c <= 19; c++) { for (r = 7; r <= 9; r++) setPeg(r, c, body); }                 // cab
  for (c = 20; c <= 22; c++) { for (r = 10; r <= 11; r++) setPeg(r, c, bodyDark); }          // hood
  for (c = 14; c <= 17; c++) { for (r = 8; r <= 9; r++) setPeg(r, c, glass); }               // window
  setPeg(10, 22, light); setPeg(11, 22, light);                                            // headlight
  setPeg(12, 3, "#ff3b30");                                                                // tail light
  [[7], [18]].forEach(function (wc) {                                                      // wheels
    for (r = 13; r <= 15; r++) for (c = wc[0] - 1; c <= wc[0] + 1; c++) setPeg(r, c, tire);
    setPeg(14, wc[0], hub);
  });
  for (c = 2; c <= 23; c++) setPeg(16, c, "#57503f");                                      // ground line
}
function surprisePreset() {
  clearBoard();
  pegs.forEach(function (peg, i) {
    if (Math.random() < 0.16) { var hex = COLORS[Math.floor(Math.random() * COLORS.length)].hex; peg.classList.add("on"); peg.style.setProperty("--peg", hex); peg.style.setProperty("--peg-dim", dim(hex)); }
  });
  save();
}

buildPalette();
buildBoard();
load();
document.getElementById("clearBtn").addEventListener("click", function () {
  var unit = document.getElementById("unit");
  unit.classList.remove("shake"); void unit.offsetWidth; unit.classList.add("shake");
  clearBoard();
});
document.getElementById("randomBtn").addEventListener("click", surprisePreset);
document.getElementById("heartBtn").addEventListener("click", function () { preset(heartPreset); });
document.getElementById("starBtn").addEventListener("click", function () { preset(starPreset); });
document.getElementById("truckBtn").addEventListener("click", function () { preset(truckPreset); });

if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
</script>

<script id="hw-script">
(function () {
  var KEY = 'ashleys-halloween';
  function pref() { try { return localStorage.getItem(KEY) || 'auto'; } catch (e) { return 'auto'; } }
  function setPref(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  function inSeason() { var n = new Date(), m = n.getMonth(), d = n.getDate(); return (m === 9 && d >= 24) || (m === 10 && d <= 1); }
  function isOn() { var p = pref(); return p === 'on' || (p === 'auto' && inSeason()); }
  var GLYPHS = [['1f383','\u{1F383}','6%','12%',34,7],['1f47b','\u{1F47B}','88%','16%',30,8],['1f987','\u{1F987}','14%','68%',26,6],['1f315','\u{1F315}','92%','64%',30,9],['1f578','\u{1F578}\u{FE0F}','3%','38%',28,10],['1f987','\u{1F987}','78%','84%',22,7],['1f383','\u{1F383}','94%','40%',24,8],['1f47b','\u{1F47B}','10%','88%',24,9]];
  function apply() {
    var on = isOn();
    document.body.classList.toggle('halloween', on);
    var b = document.getElementById('hwBanner'); if (b) b.style.display = on ? 'block' : 'none';
    var l = document.getElementById('hwLayer'); if (l) l.style.display = on ? 'block' : 'none';
    var t = document.getElementById('hwToggle'); if (t) t.textContent = '\u{1F383} Halloween: ' + (pref() === 'auto' ? 'Auto' : (pref() === 'on' ? 'On' : 'Off'));
  }
  function build() {
    var wrap = document.querySelector('.wrap');
    if (wrap && !document.getElementById('hwBanner')) {
