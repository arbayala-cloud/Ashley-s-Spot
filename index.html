<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashley Ayala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@700;900&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 4px; background: #222; color: #161616; font-family: Georgia, 'Times New Roman', serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 20px 22px 48px; }
  header { text-align: center; }
  h1.masthead { margin: 18px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 72px; line-height: 1.05; letter-spacing: 1px; color: #111; }
  h1.masthead a { color: #111; text-decoration: none; }
  .rule-top { border-top: 3px solid #111; border-bottom: 1px solid #111; height: 4px; margin-top: 10px; }
  section { margin-top: 38px; }
  section h2 { margin: 0 0 14px; font-family: 'Bitter', Georgia, serif; font-weight: 900; font-size: 27px; letter-spacing: .2px; color: #111; border-bottom: 2px solid #111; padding-bottom: 10px; }
  .story-note { margin: 0; font-size: 16px; line-height: 1.6; color: #2b2b2b; }
  footer { border-top: 3px double #111; margin-top: 46px; padding-top: 16px; font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; text-align: center; color: #999; }
  .menu-row { text-align: center; margin: 14px 0 0; }
  .menu-row button { font-family: Arial, Helvetica, sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; background: none; color: #111; border: 1.5px solid #111; border-radius: 999px; padding: 7px 18px; cursor: pointer; }
  .menu-panel { display: none; text-align: center; margin-top: 6px; }
  .menu-panel.open { display: block; }
  .menu-panel a { display: block; font-family: 'Bitter', Georgia, serif; font-weight: 700; font-size: 20px; line-height: 1.3; color: #111; text-decoration: none; padding: 8px 0; }
  .menu-panel button.install-btn { display: block; width: 100%; font-family: 'Bitter', Georgia, serif; font-weight: 700; font-size: 20px; line-height: 1.3; color: #111; background: none; border: none; padding: 8px 0; cursor: pointer; }
  body.dark .menu-panel button.install-btn { color: #f4f1ea; }
  @media (hover: hover) { .menu-panel a:hover { text-decoration: underline; text-underline-offset: 3px; } }
  .mila-photo { width: 100%; height: auto; display: block; border: 1px solid #111; padding: 8px; background: #fff; }
  body.dark .mila-photo { border-color: #f4f1ea; background: #1c1a17; }
  .caption { text-align: center; font-style: italic; font-size: 14px; color: #666; margin: 8px 0 0; }
  .foot-name { font-size: 12px; letter-spacing: 3px; color: #555; margin-bottom: 8px; }
  .theme-toggle { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 0 10px; border-top: 1px solid #eee9df; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; color: #6f6a62; }
  .theme-switch { position: relative; width: 50px; height: 28px; flex: 0 0 auto; }
  .theme-switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .theme-switch .slider { position: absolute; inset: 0; background: #c9c2b6; border-radius: 999px; transition: .25s; }
  .theme-switch .slider::before { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; background: #fff; border-radius: 50%; transition: .25s; }
  .theme-switch input:checked + .slider { background: #b9975b; }
  .theme-switch input:checked + .slider::before { transform: translateX(22px); }
  .theme-switch input:focus-visible + .slider { outline: 2px solid #b9975b; outline-offset: 2px; }

  body.dark { background: #1c1a17; color: #f4f1ea; }
  body.dark h1.masthead a { color: #f4f1ea; }
  body.dark .rule-top { border-top-color: #f4f1ea; border-bottom-color: #f4f1ea; }
  body.dark .caption, body.dark .foot-name { color: #b8b0a3; }
  body.dark section h2 { color: #f4f1ea; border-bottom-color: #f4f1ea; }
  body.dark .story-note { color: #d8d2c8; }
  body.dark footer { border-top-color: #55504a; color: #9a948c; }
  body.dark .menu-row button { color: #f4f1ea; border-color: #f4f1ea; }
  body.dark .menu-panel a { color: #f4f1ea; }
  body.dark .theme-toggle { color: #b8b0a3; border-top-color: #3a3631; }

  @media (max-width: 640px) { h1.masthead { font-size: 42px; } .wrap { padding: 26px 16px 40px; } section h2 { font-size: 23px; } }
  @media (min-width: 641px) { .story-note { text-align: justify; hyphens: auto; } }




  .screen { width: 98vw; margin: 0 auto; background: #fdfdfc; border: 4px solid #111; border-radius: 10px 10px 4px 4px; overflow: hidden; min-height: 98vh; display: flex; flex-direction: column; text-align: center; }
  .screen > main { flex: 1; }
  .statusbar { background: #111; color: #fff; font-family: monospace; font-size: 12px; display: flex; justify-content: space-between; padding: 4px 8px; }
  .hinge { width: 98vw; height: 10px; background: #111; border-radius: 0 0 8px 8px; margin: 0 auto; }
  body.dark .screen { background: #1c1a17; color: #f4f1ea; }
</style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">
</head>
<body>
<div class="screen">
<div class="statusbar"><span>📶 Verizon</span><span id="clock">--:--</span><span id="battery">🔋</span></div>
<main class="wrap">
  <header>
    <div class="rule-top"></div>
    <h1 class="masthead"><a href="index.html">Ashley Ayala</a></h1>
    <div class="rule-top"></div>
    <div class="menu-row"><button id="menuBtn" type="button" aria-expanded="false" aria-controls="menuPanel">&#9776; Menu</button></div>
    <nav id="menuPanel" class="menu-panel">
      <a href="index.html">Home</a>
      <a href="blog.html">Blog</a>
      <a href="jukebox.html">Jukebox</a>
      <button class="install-btn" id="installBtn" type="button">Install App</button>
      <button class="install-btn" id="refreshBtn" type="button" onclick="location.reload()">↻ Refresh Page</button>
      <div class="theme-toggle">
        <span>Light</span>
        <label class="theme-switch" for="themeToggle"><input type="checkbox" id="themeToggle" aria-label="Toggle dark mode"><span class="slider"></span></label>
        <span>Dark</span>
      </div>
    </nav>
  </header>

  <section>
    <img class="mila-photo" src="mila.jpg" alt="Mila">
    <p class="caption">She rules the whole house.</p>
  </section>



  <footer>&copy; 2026 Ashley Ayala</footer>
</main>
</div>
<div class="hinge"></div>
<script>
  document.getElementById('menuBtn').addEventListener('click', function () {
    var panel = document.getElementById('menuPanel');
    var open = panel.classList.toggle('open');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // Site-wide dark / light choice, saved so every page opens the same way.
  (function () {
    var toggle = document.getElementById('themeToggle');
    function applyTheme(dark) {
      document.body.classList.toggle('dark', dark);
      if (toggle) toggle.checked = dark;
      try { localStorage.setItem('ashleys-theme', dark ? 'dark' : 'light'); } catch (e) {}
    }
    try { if (localStorage.getItem('ashleys-theme') === 'dark') applyTheme(true); } catch (e) {}
    if (toggle) toggle.addEventListener('change', function () { applyTheme(this.checked); });
  })();

</script>

<script>
  (function() {
    var installBtn = document.getElementById('installBtn');
    var deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
    if (installBtn) {
      installBtn.addEventListener('click', function() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function() { deferredPrompt = null; });
        } else {
          alert("To install Ashley's Spot on your phone: open this page in Chrome, tap the three dots menu, then tap Add to Home Screen.");
        }
      });
    }
  })();
</script>




<script>
function tick(){
  var d = new Date();
  var h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  document.getElementById('clock').textContent = h + ':' + String(m).padStart(2,'0') + ' ' + ap;
}
tick(); setInterval(tick, 30000);
function setBattery(level, charging){
  var el = document.getElementById('battery');
  var pct = Math.round(level * 100);
  var color = pct > 50 ? '🟢' : (pct > 20 ? '🟡' : '🔴');
  el.textContent = (charging ? '⚡' : '') + color + ' ' + pct + '%';
}
if (navigator.getBattery) {
  navigator.getBattery().then(function(b){
    setBattery(b.level, b.charging);
    b.addEventListener('levelchange', function(){ setBattery(b.level, b.charging); });
    b.addEventListener('chargingchange', function(){ setBattery(b.level, b.charging); });
  }).catch(function(){ document.getElementById('battery').textContent = '🟢 100%'; });
} else {
  document.getElementById('battery').textContent = '🟢 100%';
}
</script>
</body>
</html>
