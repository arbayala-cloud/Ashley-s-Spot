  .deck { max-width: 560px; margin: 12px auto 0; background: #333; border-radius: 16px; padding: 14px; }
  .deck iframe { display: block; border: none; width: 100%; aspect-ratio: 16 / 9; height: auto; background: #000; border-radius: 8px; }
  .controls-row { display: flex; gap: 10px; margin-top: 12px; }

var pick = document.getElementById("songpick");
var ytEl = document.getElementById("ytplayer");
var screenTitle = document.getElementById("screenTitle");
var screenArtist = document.getElementById("screenArtist");
var prevBtn = document.getElementById("prevBtn");
var nextBtn = document.getElementById("nextBtn");
var currentIndex = -1;

function playSong(i) {
  if (i < 0 || i >= SONGS.length) return;
  currentIndex = i;
  var s = SONGS[i];
  ytEl.src = "https://www.youtube.com/embed/" + s[3] + "?autoplay=1&rel=0";
  screenTitle.textContent = s[0];
  screenArtist.textContent = s[1];
  pick.selectedIndex = i + 1;
  prevBtn.disabled = false;
  nextBtn.disabled = false;
}
pick.onchange = function() {
  playSong(pick.selectedIndex - 1);
};
prevBtn.onclick = function() {
  if (currentIndex < 0) return;
  playSong((currentIndex - 1 + SONGS.length) % SONGS.length);
};
nextBtn.onclick = function() {
  if (currentIndex < 0) return;
  playSong((currentIndex + 1) % SONGS.length);
};
