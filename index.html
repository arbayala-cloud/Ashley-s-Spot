<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashley Ayala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@700;900&family=Cormorant+Garamond:wght@500;600&family=Press+Start+2P&family=Rock+Salt&family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 22px 12px 40px; background: #d8d2c7; color: #26221e; font-family: Inter, Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 20px 22px 48px; }
  header { text-align: center; }
  h1.masthead { margin: 18px 0; font-family: Oswald, Inter, sans-serif; font-weight: 700; font-size: clamp(26px, 7vw, 36px); line-height: 1.25; letter-spacing: 3px; text-transform: uppercase; color: #26221e; }
  h1.masthead a { color: #26221e; text-decoration: none; }
  .rule-top { border-top: 3px solid #26221e; border-bottom: 2px solid #8a5a33; height: 4px; margin-top: 10px; }
  section { margin-top: 40px; }
  section h2 { margin: 0 0 14px; font-family: 'Bitter', Georgia, serif; font-weight: 900; font-size: 27px; letter-spacing: .2px; color: #111; border-bottom: 2px solid #111; padding-bottom: 10px; }
  .story-note { margin: 0; font-size: 16px; line-height: 1.6; color: #2b2b2b; }
  .screen-copy { border-top: 2px solid #c9c2b6; margin: 46px 0 0; padding-top: 16px; font-family: Oswald, Inter, sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; text-align: center; color: #8a857e; }
  .menu-row { text-align: center; margin: 40px 0 0; }
  .menu-row button { font-family: Oswald, Inter, sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; background: none; color: #26221e; border: 1.5px solid #26221e; border-radius: 8px; padding: 9px 22px; cursor: pointer; font-weight: 600; }
  .menu-panel { display: none; text-align: center; margin: 10px auto 0; max-width: 420px; background: #fff; border: 1px solid #cfc8b8; border-radius: 10px; padding: 6px 0; box-shadow: 0 14px 30px rgba(38,34,30,.12); }
  .menu-panel.open { display: block; }
  .menu-panel a { display: block; font-family: Oswald, Inter, sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 1px; text-transform: uppercase; line-height: 1.3; color: #26221e; text-decoration: none; padding: 11px 0; border-bottom: 1px solid #eee9df; }
  .menu-panel button.install-btn { display: block; width: 100%; font-family: Oswald, Inter, sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 1px; text-transform: uppercase; line-height: 1.3; color: #26221e; background: none; border: none; padding: 11px 0; cursor: pointer; }
  body.dark .menu-panel button.install-btn { color: #f4f1ea; }
  @media (hover: hover) { .menu-panel a:hover { text-decoration: underline; text-underline-offset: 3px; } }
  .mila-photo { width: 100%; height: auto; display: block; border: 1px solid #111; padding: 8px; background: #fff; }
  body.dark .mila-photo { border-color: #f4f1ea; background: #1c1a17; }
  .caption { text-align: center; font-style: italic; font-size: 14px; color: #666; margin: 8px 0 0; }
  .foot-name { font-size: 12px; letter-spacing: 3px; color: #555; margin-bottom: 8px; }
  .theme-toggle { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 0 10px; border-top: 1px solid #eee9df; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; color: #6f6a62; }
  .theme-switch { position: relative; width: 50px; height: 28px; flex: 0 0 auto; }
  .theme-switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .theme-switch .slider { position: absolute; inset: 0; background: #c9c2b6; border-radius: 999px; transition: .25s; }
  .theme-switch .slider::before { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; background: #fff; border-radius: 50%; transition: .25s; }
  .theme-switch input:checked + .slider { background: #b9975b; }
  .theme-switch input:checked + .slider::before { transform: translateX(22px); }
  .theme-switch input:focus-visible + .slider { outline: 2px solid #b9975b; outline-offset: 2px; }

  body.dark { background: #141210; color: #f4f1ea; }
  body.dark h1.masthead a { color: #f2ead6; }
  body.dark .rule-top { border-top-color: #f4f1ea; border-bottom-color: #c8a165; }
  body.dark .caption, body.dark .foot-name { color: #b8b0a3; }
  body.dark section h2 { color: #f4f1ea; border-bottom-color: #f4f1ea; }
  body.dark .story-note { color: #d8d2c8; }
  body.dark .screen-copy { border-top-color: #3a3631; color: #9a948c; }
  body.dark .menu-row button { color: #f4f1ea; border-color: #f4f1ea; }
  body.dark .menu-panel { background: #2a2723; border-color: #44403a; }
  body.dark .menu-panel a { color: #f4f1ea; border-bottom-color: #3a3631; }
  body.dark .theme-toggle { color: #b8b0a3; border-top-color: #3a3631; }

  @media (max-width: 640px) { .wrap { padding: 26px 16px 40px; } section h2 { font-size: 23px; } }
  @media (min-width: 641px) { .story-note { text-align: justify; hyphens: auto; } }




  .screen { width: 436px; max-width: 96vw; margin: 0 auto; background: #f4f1ea; border: 4px solid #26221e; border-left-width: 12px; border-right-width: 12px; border-radius: 24px 24px 4px 4px; overflow: hidden; min-height: 600px; display: flex; flex-direction: column; text-align: center; box-shadow: 0 22px 45px rgba(0, 0, 0, 0.6), 0 4px 12px rgba(0, 0, 0, 0.5), inset 0 2px 0 rgba(255, 255, 255, 0.5), inset 10px 0 18px -10px rgba(0, 0, 0, 0.35), inset -10px 0 18px -10px rgba(0, 0, 0, 0.35); }
  .screen > main { flex: 1; }
  .statusbar { background: linear-gradient(180deg, #2b2b2b 0%, #111 60%, #000 100%); color: #fff; font-family: monospace; font-size: 12px; display: flex; justify-content: space-between; padding: 4px 8px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18); }
  .hinge { width: 436px; max-width: 96vw; height: 10px; background: linear-gradient(180deg, #2e2e2e 0%, #111 45%, #000 100%); border-radius: 0 0 16px 16px; margin: 0 auto; box-shadow: 0 12px 22px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.2); }
  body.dark .screen { background: #1e1b17; color: #f4f1ea; }


  .sotd { text-align: center; margin-top: 40px; background: linear-gradient(180deg, #2e2a24, #1b1813); border: 2px solid #4a4238; border-radius: 14px; padding: 20px 14px 18px; box-shadow: 0 16px 32px rgba(38,34,30,.28); }
  .sotd-label { font-family: Oswald, Inter, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #d8c9a3; margin-bottom: 6px; }
  .sotd-track { font-family: Oswald, Inter, sans-serif; font-weight: 600; font-size: 19px; line-height: 1.5; letter-spacing: .5px; color: #f5f2ec; margin-bottom: 16px; }
  .sotd-transport { display: flex; gap: 12px; justify-content: center; align-items: center; }
  .sotd-tbtn { background: #2e2a24; color: #ece5d3; border: 2px solid #57503f; width: 48px; height: 48px; border-radius: 50%; font-size: 18px; line-height: 1; cursor: pointer; }
  .sotd-tbtn.sotd-main { width: 58px; height: 58px; font-size: 22px; background: #c8a165; border-color: #8a5a33; color: #171410; }
  #sotdPlayer { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  body.dark .sotd-label { color: #d8c9a3; }
  body.dark .sotd-track { color: #f5f2ec; }

<script>
  document.getElementById('menuBtn').addEventListener('click', function () {
    var panel = document.getElementById('menuPanel');
    var open = panel.classList.toggle('open');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // Site-wide dark / light choice, saved so every page opens the same way.
  (function () {
    var toggle = document.getElementById('themeToggle');
    function applyTheme(dark) {
      document.body.classList.toggle('dark', dark);
      if (toggle) toggle.checked = dark;
      try { localStorage.setItem('ashleys-theme', dark ? 'dark' : 'light'); } catch (e) {}
    }
    try { if (localStorage.getItem('ashleys-theme') === 'dark') applyTheme(true); } catch (e) {}
    if (toggle) toggle.addEventListener('change', function () { applyTheme(this.checked); });
  })();

</script>

<script>
function tick(){
  var d = new Date();
  var h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  document.getElementById('clock').textContent = h + ':' + String(m).padStart(2,'0') + ' ' + ap;
}
tick(); setInterval(tick, 30000);
function setBattery(level, charging){
  var el = document.getElementById('battery');
  var pct = Math.round(level * 100);
  var color = pct > 50 ? '🟢' : (pct > 20 ? '🟡' : '🔴');
  el.textContent = (charging ? '⚡' : '') + color + ' ' + pct + '%';
}
if (navigator.getBattery) {
  navigator.getBattery().then(function(b){
    setBattery(b.level, b.charging);
    b.addEventListener('levelchange', function(){ setBattery(b.level, b.charging); });
    b.addEventListener('chargingchange', function(){ setBattery(b.level, b.charging); });
  }).catch(function(){ document.getElementById('battery').textContent = '🟢 100%'; });
} else {
  document.getElementById('battery').textContent = '🟢 100%';
}

(function () {
  var now = new Date();
  var start = new Date(now.getFullYear(), 0, 0);
  var day = Math.floor((now - start) / 86400000);
  var cur = day % CARTOONS.length;
  var tries = 0;
  var img = document.getElementById('dailyCartoon');
  var cred = document.getElementById('cartoonCredit');
  var cap = document.getElementById('polaroidCaption');
  var backName = document.getElementById('polaroidBackName');
  var backYear = document.getElementById('polaroidBackYear');
  var backFact = document.getElementById('polaroidBackFact');
  function show(i) {
    var n = ((i % CARTOONS.length) + CARTOONS.length) % CARTOONS.length;
    cur = n;
    var c = CARTOONS[n];
    img.alt = c.name + ' - 90s cartoon of the day';
    cred.textContent = c.name + ' \u2014 Photo: ' + c.credit;
    img.src = c.img;
    cap.textContent = c.name + ' - ' + c.year;
    backName.textContent = c.name;
    backYear.textContent = c.year;
    backFact.textContent = c.fact;
  }
  img.onerror = function () {
    tries++;
    if (tries < CARTOONS.length) { show(cur + 1); }
  };
  show(cur);
  var card = document.getElementById('polaroidCard');
  function flipCard() { card.classList.toggle('flipped'); }
  card.addEventListener('click', flipCard);
  card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flipCard(); } });
  document.getElementById('cartoonPrev').addEventListener('click', function () { card.classList.remove('flipped'); tries = 0; show(cur - 1); });
  document.getElementById('cartoonNext').addEventListener('click', function () { card.classList.remove('flipped'); tries = 0; show(cur + 1); });
})();
</script>
<script>
(function () {
  var ctx = null, last = 0;
  function tone(freq, dur, delay) {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      var t = ctx.currentTime + (delay || 0);
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  }
  function blip() { tone(880, 0.07, 0); }
  function chirp() { tone(660, 0.07, 0); tone(990, 0.09, 0.07); }
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button, a, label') : null;
    if (!t) return;
    var now = Date.now();
    if (now - last < 90) return;
    last = now;
    if (t.id === 'sotdPlayBtn') chirp(); else blip();
  }, true);
})();
</script>
<script>
(function () {
  var layer = document.createElement('div');
  layer.id = 'sparkleLayer';
  document.body.appendChild(layer);
  var last = 0, lastX = -999, lastY = -999;
  function spawn(x, y, n) {
    for (var k = 0; k < n; k++) {
      if (layer.childNodes.length > 40) return;
      var s = document.createElement('span');
      s.className = 'sparkle';
      var size = 8 + Math.random() * 8;
      s.textContent = ['\u2726', '\u2727', '\u2605'][Math.floor(Math.random() * 3)];
      s.style.left = (x + (Math.random() * 16 - 8)) + 'px';
      s.style.top = (y + (Math.random() * 16 - 8)) + 'px';
      s.style.fontSize = size + 'px';
      var colors = ['#ff5da2', '#a855f7', '#2dd4bf', '#f5c542', '#38bdf8', '#ff7a00', '#a3e635'];
      var col = colors[Math.floor(Math.random() * colors.length)];
      s.style.color = col;
      s.style.textShadow = '0 0 8px ' + col;
      s.style.setProperty('--dx', (Math.random() * 40 - 20) + 'px');
      s.addEventListener('animationend', function () { s.remove(); });
      layer.appendChild(s);
    }
  }
  document.addEventListener('pointermove', function (e) {
    var now = Date.now();
    if (now - last < 40) return;
    if (Math.abs(e.clientX - lastX) < 6 && Math.abs(e.clientY - lastY) < 6) return;
    last = now; lastX = e.clientX; lastY = e.clientY;
    spawn(e.clientX, e.clientY, 1);
  }, { passive: true });
  document.addEventListener('pointerdown', function (e) { spawn(e.clientX, e.clientY, 5); }, { passive: true });
})();
</script>
